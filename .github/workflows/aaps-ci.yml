name: AAPS CI

​on:

push:

branches: [ master ]

workflow_dispatch:

inputs:

tagNames:

description: 'Select AAPS Version'

required: true

default: '3.4.2.6'

type: choice

options:

- 3.4.2.6

- 3.4.2.4

- 3.4.2.3

- 3.4.2.2

- 3.4.2.1

- 3.4.2.0

- 3.4.1.0

- 3.4.0.0

​jobs:

build:

name: Build and Sign AAPS

runs-on: ubuntu-latest

​steps:

- name: Checkout Code

uses: actions/checkout@v4

​- name: Set up JDK 17

uses: actions/setup-java@v4

with:

distribution: 'temurin'

java-version: '17'

​- name: Decode Keystore

run: |

echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

​- name: Grant execute permission for gradlew

run: chmod +x gradlew

​- name: Build Signed Release APK

run: ./gradlew assembleRelease

env:

ORG_GRADLE_PROJECT_AAPS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

ORG_GRADLE_PROJECT_AAPS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

ORG_GRADLE_PROJECT_AAPS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

ORG_GRADLE_PROJECT_AAPS_KEYSTORE: keystore.jks

​- name: Upload APK Artifact

uses: actions/upload-artifact@v4

with:

name: aaps-release-apk

path: app/build/outputs/apk/release/*.apk
