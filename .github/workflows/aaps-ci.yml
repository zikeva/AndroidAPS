name: AAPS CI

on:
push:
branches: [ master ]
workflow_dispatch:
inputs:
tagNames:
description: 'Select AAPS Version'
required: true
default: '3.4.2.6'
type: choice
options:
- 3.4.2.6
- 3.4.2.4
- 3.4.2.3
- 3.4.2.2
- 3.4.2.1
- 3.4.2.0
- 3.4.1.0
- 3.4.0.0

jobs:
build:
name: Build AAPS
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4

- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'

- name: Build with Gradle
run: ./gradlew assembleRelease

- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: aaps-release-apk
path: app/build/outputs/apk/release/
